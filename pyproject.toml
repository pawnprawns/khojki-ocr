[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khojki-ocr-takehome"
version = "1.0.0"
description = "A local, auditable OCR pipeline for historical printed Khojki"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<6",
  "torch>=2.6,<3",
  "pypdfium2>=4.30,<6",
  "Pillow>=10.4,<14",
]

[project.scripts]
khojki-ocr = "khojki_ocr.cli:main"
khojki-evaluate = "khojki_ocr.evaluate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khojki_ocr = ["assets/*.json", "assets/*.pt", "assets/*.ttf", "assets/*.txt"]
